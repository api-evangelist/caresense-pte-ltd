name: Caresense Pte. Ltd.
description: 'CareSense Pte. Ltd. (CareSense.ai) is a Singapore-based preventive digital health company
  building AI-powered health coaching. Its flagship product is Mandy, a 24/7 AI health coach delivered
  over chat and voice, paired with the CareSense.ai app — a personal health dashboard covering nutrition,
  exercise, sleep and stress — and integrated health services including blood testing and telemedicine.
  The company sells both to individuals and to enterprise teams as a workplace wellbeing programme.
  CareSense was incorporated in Singapore on 14 June 2024 (UEN 202424008M), registered at 160 Robinson
  Road #14-04, and was founded by Lucas Ngoo, co-founder of Carousell, and Julian Koo, founder of the
  home-care platform Jaga-Me. As of this enrichment pass CareSense publishes no public API, developer
  portal, API documentation or SDKs; its technology surface is consumer and enterprise applications
  fronted by a Vanta-hosted trust center.'
